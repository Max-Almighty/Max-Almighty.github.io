const DIFF={"United Kingdom":1,"Soviet Union":2,"France":2,"Germany":3,"Italy":3,"Poland":4,"Czechoslovakia":4,"Hungary":4,"Austria":5,"Lithuania":4,"Albania":5,"Finland":3,"Switzerland":3,"Sweden":2,"Norway":3,"Ireland":3,"Portugal":3,"Spain":2,"Turkey":2},DL=["","Easy","Medium","Hard","Very Hard","Extreme"],DC=["","#2fb36a","#8fbf3f","#e0a32f","#e0663a","#c43434"];

function menu(){const mb=(m,t,d)=>`<button data-m="${m}" class="${MODE===m?"go":""}">${t}<small>${d}</small></button>`,
 nb=k=>{const l=diff(k);return `<button data-k="${k}" style="border-left-color:${NAT[k].c}">${k}<span class="dif" style="color:${DC[l]}">${"●".repeat(l)}${"○".repeat(5-l)} ${DL[l]}</span><small>${NAT[k].tr.length?NAT[k].tr.map(t=>ic(t)+" <b>"+t[0]+"</b>: "+t[1]).join("<br>"):"No special traits."}</small></button>`};
 $("card").innerHTML=`<h1>Mini Front</h1><p>Turn-based Europe, ${D.p.length} provinces, ${Object.keys(NAT).length} nations. Choose a mode, then any nation to play. Difficulty is a rough guide for the mode you pick, and goals change with each scenario.${MODE==="h39"?" Austria, Czechoslovakia and Albania no longer exist by 1939, so they aren't playable here.":""}</p><div class="pick" style="margin-bottom:10px">${mb("h36","The Gathering Storm","Historical · Jan 1936. The Anschluss, Sudetenland, Memel and Albania happen on schedule, then the war.")}${mb("h39","Blitzkrieg: September 1939","Historical · The annexations are done and Germany is at war with Poland.")}${mb("norm","Balance of Power","Normal · 1936 borders, everyone at peace. The AI decides when to declare war.")}</div><h3>Great powers</h3><div class="pick">${MAJ.map(nb).join("")}</div><h3>Other nations</h3><div class="pick">${Object.keys(NAT).filter(k=>!MAJ.includes(k)&&(MODE!=="h39"||!GONE39.includes(k))).sort((x,y)=>diff(x)-diff(y)||x.localeCompare(y)).map(nb).join("")}</div>`;
 $("ov").classList.remove("hide");document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>init(b.dataset.k));document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;menu()})}
const tgtN=()=>{if(insp==null)return null;const o=C[insp].own;return o==="N"||o===me?null:o};
function draw(){if(!C)return;const nl=sel!=null?adj[sel]:[],ns=sel!=null?SE[sel]:[];let rt="";
 const colr=k=>maps==="pol"||k===me||isAlly(me,k)||atWar(me,k);
 C.forEach((c,i)=>{const e=els[i];e.u.style.fill=c.own==="N"?"var(--neu)":colr(c.own)?NAT[c.own].c:"var(--gry)";
  e.o.setAttribute("class",i===sel||i===insp?"ov sl":nl.includes(i)?"ov tg":ns.includes(i)?"ov sg":"ov");
  const ct=D.cities[i];e.t.textContent=(c.cap?"★ ":ct?"◆ ":"")+(c.u||"")+(c.own===me&&c.r>0?" •":"");e.t.style.fontSize=c.cap?"11px":ct?"9px":"";e.t.classList.toggle("n",!c.cap&&!ct&&i!==sel&&i!==insp)});
 if(sel!=null)for(const j of ns)rt+=`<line class="rl" x1="${C[sel].cx}" y1="${C[sel].cy}" x2="${C[j].cx}" y2="${C[j].cy}"/>`;
 $("rt").innerHTML=rt;
 $("who").innerHTML=`<b style="color:${NAT[me].c}">${me}</b>`;$("gold").textContent=gold[me];$("inc").textContent=inc(me);$("regs").textContent=cnt(me);
 const m=gm()%12,y=1936+Math.floor(gm()/12);lbs.forEach(e=>{e.style.display=cnt(NATU[e.dataset.n])?"":"none"});nls.forEach(e=>{const i=+e.dataset.i,c=C[i];e.style.display=c.cap||D.cities[i]?"":"none";e.style.fontSize=c.cap?"7.5px":"6px"});$("date").textContent=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m]+" "+y+" · Turn "+(turn+1);
 const wars=[...W.keys()].filter(x=>x.split("|").includes(me)).map(x=>x.split("|").find(n=>n!==me)),al=ALY[me]?[...ALY[me]].filter(n=>cnt(n)):[],nm=a=>a.map(n=>`<b style="color:${NAT[n].c}">${n}</b>`).join(", ");
 $("dip").innerHTML=`<span>At war: ${wars.length?nm(wars):"nobody"}</span><span>Allies: ${al.length?nm(al):"none"}</span>`;
 const c=sel!=null?C[sel]:insp!=null?C[insp]:null,k=tgtN();
 const ci=sel!=null?sel:insp;$("tm").textContent=TECH[me].cur==null&&TREE.some((b,i)=>TECH[me].d[i]<3)?"Tech •":"Tech";
 $("info").textContent=c?`${c.name}${c.cap?" (capital)":""}${D.cities[ci]?" ["+D.cities[ci].map(t=>CT[t][0]+": "+CT[t][1]).join(", ")+"]":""}, ${c.cn}: ${c.u} units${c.own===me?` (${c.r} ready)`:c.own==="N"?" — unclaimed":atWar(me,c.own)?" — at war":isAlly(me,c.own)?" — ally":" — at peace"}, ${TN[c.t]}${ns.length&&sel!=null?" · "+ns.filter(j=>!nl.includes(j)).length+" sea routes":""}`:"Drag to pan, scroll or pinch to zoom. A • marks units that can still move.";
 $("clr").style.display=sel!=null||insp!=null?"":"none";$("rec").disabled=sel==null||C[sel].own!==me||gold[me]<10||over;$("army").textContent=tu(me)+"/"+capArmy(me);$("mode").textContent="Send: "+MODES[mode];$("mm").textContent="Map: "+(maps==="dip"?"Diplomacy":"Political");
 $("dw").disabled=!k||atWar(me,k)||isAlly(me,k)||over;$("pc").disabled=!k||!atWar(me,k)||over;$("dw").textContent=k&&!atWar(me,k)?"Declare war on "+k:"Declare war";}
function setV(){V.w=Math.min(FW,Math.max(90,V.w));V.h=V.w*FH/FW;V.x=Math.min(FW-V.w,Math.max(0,V.x));V.y=Math.min(FH-V.h,Math.max(0,V.y));
 svg.setAttribute("viewBox",`${V.x} ${V.y} ${V.w} ${V.h}`);svg.classList.toggle("lo",V.w>520);svg.classList.toggle("zi",V.w<330);svg.classList.toggle("xl",V.w>760)}
function zoomAt(f,px,py){const r=svg.getBoundingClientRect(),fx=(px-r.left)/r.width,fy=(py-r.top)/r.height,mx=V.x+fx*V.w,my=V.y+fy*V.h;V.w*=f;V.h=V.w*FH/FW;V.x=mx-fx*V.w;V.y=my-fy*V.h;setV()}
const ptr=new Map();let moved=0,tgt=null,pd=0;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){moved=0;tgt=e.target.closest("g[data-i]")}else{moved=99;const[a,b]=[...ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;
 if(ptr.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)zoomAt(pd/d,(a.x+b.x)/2,(a.y+b.y)/2);pd=d;return}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(moved>8){const r=svg.getBoundingClientRect();V.x-=dx*V.w/r.width;V.y-=dy*V.w/r.width;setV()}});
svg.addEventListener("pointerup",e=>{const was=ptr.size;ptr.delete(e.pointerId);if(was===1&&moved<=8){if(tgt)pick(+tgt.dataset.i);else if(C&&!over){sel=null;insp=null;draw()}}pd=0});
svg.addEventListener("pointercancel",e=>{ptr.delete(e.pointerId);pd=0});
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
$("zi").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.4,r.left+r.width/2,r.top+r.height/2)};
$("zo").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.4,r.left+r.width/2,r.top+r.height/2)};

function doAttack(a,i){const n=send(a);if(n<1){log("No ready units in "+C[a].name+".");return}fight(a,i,n);sel=C[i].own===me?i:null;check()}
function ask(k){$("card").innerHTML=`<h1>Declare war on ${k}?</h1><p>You are at peace with ${k}. Attacking them means declaring war, and their allies may join them.</p><div class="pick"><button class="go" id="yes">Declare war</button><button id="no">Cancel</button></div>`;
 $("ov").classList.remove("hide");$("yes").onclick=()=>{$("ov").classList.add("hide");declareWar(me,k);if(pend){doAttack(pend[0],pend[1]);pend=null}draw()};$("no").onclick=()=>{$("ov").classList.add("hide");pend=null}}
function pick(i){if(over||!C)return;const c=C[i];
 if(sel!=null&&sel!==i&&C[sel].own===me&&(adj[sel].includes(i)||SE[sel].includes(i))){
  if(c.own!==me&&c.own!=="N"&&!atWar(me,c.own)){if(isAlly(me,c.own)){log(c.own+" is your ally.");draw();return}pend=[sel,i];ask(c.own);return}
  doAttack(sel,i)}
 else if(i===sel||i===insp){sel=null;insp=null}else if(c.own===me){sel=i;insp=null}else{sel=null;insp=i}
 draw()}
$("rec").onclick=()=>{if(sel==null||gold[me]<10||C[sel].own!==me)return;if(tu(me)>=capArmy(me)){log("Army size limit reached ("+capArmy(me)+"). Capture more provinces to raise it.");draw();return}gold[me]-=10;C[sel].u++;draw()};
$("dw").onclick=()=>{const k=tgtN();if(!k||atWar(me,k))return;if(isAlly(me,k)){log(k+" is your ally.");draw();return}declareWar(me,k);draw()};
$("pc").onclick=()=>{const k=tgtN();if(!k||!atWar(me,k))return;if(turn-W.get(key(me,k))<3){log("Too soon for peace talks with "+k+" (needs 3 turns of war).");draw();return}
 if(1-cnt(k)/START[k]>=.25||Math.random()<.4){W.delete(key(me,k));log("Peace with <b>"+k+"</b>. You keep the provinces you captured.")}else log("<b>"+k+"</b> refuses peace for now.");draw()};
$("mm").onclick=()=>{maps=maps==="dip"?"pol":"dip";draw()};
$("mode").onclick=()=>{mode=(mode+1)%3;draw()};
$("end").onclick=endTurn;
function peaceReq(k){if(!atWar(me,k))return;if(turn-W.get(key(me,k))<3){log("Too soon for peace talks with "+k+" (needs 3 turns of war).");draw();return}
 if(1-cnt(k)/START[k]>=.25||Math.random()<.4){W.delete(key(me,k));log("Peace with <b>"+k+"</b>. You keep the provinces you captured.")}else log("<b>"+k+"</b> refuses peace for now.");draw()}
$("pc").onclick=()=>{const k=tgtN();if(k)peaceReq(k)};
function propose(k){if(propT[k]===turn){log("You already approached <b>"+k+"</b> this turn.");return}propT[k]=turn;
 if(atWar(me,k)){log("You are at war with <b>"+k+"</b>.");return}
 if([...(ALY[k]||[])].some(x=>atWar(me,x))){log("<b>"+k+"</b> is allied with your enemy and refuses.");return}
 const foes=[...W.keys()].filter(x=>x.split("|").includes(me)).map(x=>x.split("|").find(n=>n!==me));
 const shared=foes.some(e=>atWar(k,e)),p=(MAJ.includes(k)?.2:.4)+((GUAR[k]||[]).includes(me)?.3:0)+(MODE==="h36"&&OB.some(o=>o.sh)&&MAJ.includes(k)?.4:0);
 if(shared||Math.random()<p){addAlly(me,k,true);log("<b>"+k+"</b> accepts an alliance"+(shared?" against your common enemy":"")+". Each of you will defend the other.")}
 else log("<b>"+k+"</b> declines an alliance for now.")}
function dipAct(a,k){if(over)return;
 if(a==="war")declareWar(me,k);else if(a==="peace")peaceReq(k);else if(a==="ally")propose(k);
 else if(a==="break"){if(!isAlly(me,k))return;ALY[me].delete(k);ALY[k].delete(me);BIND.delete(key(me,k));log("You broke your alliance with <b>"+k+"</b>.")}
 else if(a==="guar"){(GUAR[k]=GUAR[k]||[]).push(me);log("You now guarantee the independence of <b>"+k+"</b>. You will defend it if it is attacked.")}
 else if(a==="unguar"){GUAR[k]=(GUAR[k]||[]).filter(x=>x!==me);log("You withdrew your guarantee of <b>"+k+"</b>.")}
 draw();dipMenu()}
function dipMenu(){if(!C)return;const rows=Object.keys(NAT).filter(k=>k!==me&&cnt(k)).map(k=>({k,w:atWar(me,k)?0:isAlly(me,k)?1:2,n:cnt(k)})).sort((a,b)=>a.w-b.w||b.n-a.n);
 const bt=(a,k,t)=>`<button data-a="${a}" data-k="${k}">${t}</button>`;
 $("card").innerHTML=`<h1>Diplomacy</h1><p>Alliances and guarantees pull a nation into wars to defend its partner. AI nations may refuse alliances.</p><div class="dmsg">${logs[0]||""}</div><div class="dl">${rows.map(({k,w,n})=>{const g=(GUAR[k]||[]).includes(me),g2=(GUAR[me]||[]).includes(k);

  return `<div class="dr" title="${NAT[k].tr.map(t=>t[0]+": "+t[1]).join("; ")}"><span class="dot" style="background:${NAT[k].c}"></span><b class="nmz">${k}</b><small>${tag} · ${n} provinces</small><span class="da">${w===0?bt("peace",k,"Peace"):w===1?bt("break",k,"Break alliance"):bt("war",k,"Declare war")+bt("ally",k,"Propose alliance")}${w!==0?(g?bt("unguar",k,"Withdraw guarantee"):bt("guar",k,"Guarantee")):""}</span></div>`}).join("")}</div><button class="go" id="dclose">Close</button>`;
 $("ov").classList.remove("hide");$("dclose").onclick=()=>$("ov").classList.add("hide");
 $("card").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>dipAct(b.dataset.a,b.dataset.k))}
function guide(){$("card").innerHTML=`<div class="gd"><h1>Field Guide</h1>
<h3>Map symbols</h3><p><b>★ Capital:</b> capture it and that nation falls. Its other provinces turn grey (unclaimed). Defenders there fight 25% harder.</p><p><b>◆ Major city:</b> gives a bonus to its owner (see below). City and capital names show when you zoom in.</p><p><b>•</b> after a unit count means those units can still move this turn. <b>Cyan dashed lines</b> are sea routes you can land across.</p>
<h3>Capturing a city</h3><p>You get its bonus every turn from then on, plus <b>+10 industry</b> once as spoils of war.</p><p><b>Fortress City:</b> +30% defense for whoever holds it.<br><b>Industrial Hub:</b> +4 industry per turn.<br><b>Oil Fields:</b> +5 industry per turn.<br><b>Great Port:</b> +3 industry per turn.<br>Some cities have two bonuses.</p>
<h3>How combat works</h3><p><b>Attack</b> = units sent × your attack modifier (traits, Army Doctrine tech) × a random 0.85–1.15. Sea landings are ×0.75, or ×0.9 with a strong navy and Amphibious tech.</p><p><b>Defense</b> = defenders × terrain (plains 1, forest 1.15, mountains 1.3) × capital 1.25 × fortress city 1.3 × the defender's defense modifier (traits, Defensive Works tech) × a random 0.85–1.15.</p><p>The bigger number wins. <b>If you win</b>, you take the province and keep sent units minus 0.6 × the defenders (at least 1). <b>If you lose</b>, the attackers are wiped out and the defenders lose 0.6 × your units (at least 1 survives). An empty province falls to any attack.</p>
<h3>Economy and army</h3><p>Income per turn = (6 + 0.35 × provinces) × your income modifier × tech, plus city bonuses. A unit costs 10 industry. <b>Army x/y</b> is your army size limit, which grows with provinces and Manpower tech. Research points per turn are roughly the square root of your income divided by 1.6.</p>
<h3>War and diplomacy</h3><p>Attacking a country at peace means declaring war. Peace talks open after 3 turns of war, and you keep what you captured. <b>Alliances</b> and <b>guarantees</b> pull each side into wars to defend the other. Map mode switches between diplomacy colors and full political colors.</p>
<h3>Traits</h3><p><span class="up">▲</span> green marks a buff and <span class="down">▼</span> red marks a debuff. The Soviet purge debuff fades by 1943. Press <b>Goals</b> to see your nation's objectives and rewards. Many debuffs can be removed for good with a National Reform in the Tech menu (it needs 4 techs researched first).</p>
<button class="go" id="dclose">Close</button></div>`;$("ov").classList.remove("hide");$("dclose").onclick=()=>$("ov").classList.add("hide")}
